# Builds the site as static files and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Work out the site address
        id: base
        run: |
          # username.github.io repos (or a custom domain via CNAME) live at "/",
          # every other repo lives at "/<repo-name>/".
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -f public/CNAME ] || [ "$REPO" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        run: bunx vite build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE: ${{ steps.base.outputs.path }}

      - name: Add GitHub Pages extras
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
