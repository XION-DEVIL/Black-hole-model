# GitLab CI/CD pipeline to build and publish GitLab Pages
# Automatically sets the base path to match the project or group site.
image: oven/bun:latest

pages:
  stage: deploy
  script:
    - bun install --frozen-lockfile || bun install
    # Determine base path:
    # If the project is a root user/group site (e.g. model-web.gitlab.io), base is "/"
    # Otherwise, subproject lives under "/<project-name>/" (or full CI_PROJECT_PATH slug)
    - |
      if [ -n "$CI_PAGES_URL" ]; then
        PAGES_PATH=$(echo "$CI_PAGES_URL" | sed -E 's|^https?://[^/]+||')
        if [ -z "$PAGES_PATH" ]; then
          PAGES_PATH="/"
        fi
      else
        PAGES_PATH="/$CI_PROJECT_NAME/"
      fi
      export PAGES_BASE="$PAGES_PATH"
      echo "Deploying to base path: $PAGES_BASE"
    - bunx vite build
    # GitLab Pages expects static files in `public/` directory
    - rm -rf public_backup || true
    - if [ -d public ]; then mv public public_backup; fi
    - mkdir -p public
    - cp -r dist/client/* public/
    - cp dist/client/index.html public/404.html || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
